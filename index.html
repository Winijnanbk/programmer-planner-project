<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FO Planner — Bhatara Progress</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0f1f3d;--navy3:#1e3a6e;--blue:#2563eb;--blue2:#3b82f6;
  --sky:#e8f0fe;--white:#fff;
  --g50:#f5f7ff;--g100:#edf0fa;--g200:#d0d8ef;--g300:#b0bcdc;
  --g400:#7a8ab5;--g600:#4a5a85;
  --text:#0d1a35;--text2:#3a4f7a;--text3:#7a8ab5;
  --c-todo:#eef1ff;--c-todo-b:#b8c3e8;--c-todo-dot:#5a6fa0;
  --c-prog:#fff8e6;--c-prog-b:#f5c842;--c-prog-dot:#c47f00;
  --c-done:#e8faf0;--c-done-b:#6dd898;--c-done-dot:#15803d;
  --c-blk:#ffeaea;--c-blk-b:#f09090;--c-blk-dot:#c42020;
  --c-leave:#fefce8;--c-leave-b:#f5d84a;--c-leave-dot:#a16207;
  --c-onsite:#fff2e6;--c-onsite-b:#f5a84a;--c-onsite-dot:#c45000;
  --c-meet:#e8f2ff;--c-meet-b:#7ab8f5;--c-meet-dot:#1a4ed8;
  --c-ma:#fff4e6;--c-ma-b:#f5b87a;--c-ma-dot:#c46000;
  --sh:0 1px 4px rgba(10,25,60,0.08);--sh2:0 4px 20px rgba(10,25,60,0.12);
  --sh3:0 8px 36px rgba(10,25,60,0.18);
  --r:6px;--rm:10px;--rl:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--g50);color:var(--text);font-size:14px;line-height:1.5}

/* LOGIN */
#ls{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(155deg,#091628 0%,#0f2a5a 50%,#1a3a8a 100%);
  padding:20px;overflow:hidden;position:relative}
#ls::after{content:'FO';position:absolute;right:-30px;bottom:-60px;font-size:320px;
  font-weight:800;color:rgba(255,255,255,0.022);font-family:'IBM Plex Mono',monospace;
  letter-spacing:-12px;line-height:1;pointer-events:none}
.lc{background:var(--white);border-radius:18px;padding:34px 30px;width:100%;
  max-width:480px;box-shadow:0 32px 90px rgba(0,0,0,0.35);position:relative;z-index:1}
.lb{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.li{width:36px;height:36px;background:var(--navy);border-radius:8px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.li svg{width:18px;height:18px}
.lco{font-size:9px;font-weight:700;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
.lan{font-size:13px;font-weight:700;color:var(--text)}
.lt{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-0.4px;margin-bottom:3px}
.ls2{font-size:12px;color:var(--text2);margin-bottom:18px}
.lsl{font-size:9px;font-weight:800;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:7px}
.ng{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
@media(max-width:400px){.ng{grid-template-columns:repeat(3,1fr)}}
.nb{padding:7px 3px;border-radius:var(--r);border:1.5px solid var(--g200);background:var(--white);
  font-size:10px;font-weight:700;cursor:pointer;transition:all 0.12s;color:var(--text2);
  font-family:inherit;text-align:center;line-height:1.3;
  display:flex;flex-direction:column;align-items:center;gap:1px}
.nb .ne{font-size:16px;line-height:1}
.nb .nn{font-size:9px;font-weight:800;letter-spacing:0.2px}
.nb:hover{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.nb.sel{border-color:var(--navy);background:var(--navy);color:white}
.nb.sel .nn{color:rgba(255,255,255,0.8)}
.be{width:100%;padding:11px;border-radius:var(--rm);background:var(--navy);color:white;
  font-size:13px;font-weight:700;border:none;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all 0.15s;margin-top:3px}
.be:hover:not(:disabled){background:var(--navy3);box-shadow:var(--sh2)}
.be:disabled{opacity:0.28;cursor:not-allowed}
.lbar{height:3px;background:var(--g200);border-radius:2px;margin-top:12px;overflow:hidden;display:none}
.lbar.on{display:block}
.lbari{height:100%;background:var(--blue);border-radius:2px;animation:lb 2.5s ease-out forwards}
@keyframes lb{0%{width:0}75%{width:82%}100%{width:92%}}

/* APP */
#app{display:none;flex-direction:column;min-height:100vh}

/* TOPBAR */
.tb{background:var(--navy);height:52px;padding:0 14px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 18px rgba(0,0,0,0.28)}
.tbl{display:flex;align-items:center;gap:8px}
.tbi{width:26px;height:26px;background:rgba(255,255,255,0.1);border-radius:5px;
  display:flex;align-items:center;justify-content:center}
.tbi svg{width:13px;height:13px;stroke:white}
.tbt{font-size:13px;font-weight:800;color:white;letter-spacing:-0.3px}
.tbm{font-size:10px;color:rgba(255,255,255,0.4);margin-left:2px}
@media(max-width:420px){.tbm{display:none}}
.tbr{display:flex;align-items:center;gap:6px}
.sp{display:flex;align-items:center;gap:4px;padding:3px 8px;
  background:rgba(255,255,255,0.07);border-radius:20px;font-size:10px;color:rgba(255,255,255,0.45)}
@media(max-width:480px){.sp{display:none}}
.sd{width:5px;height:5px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sd.syn{background:#f59e0b;animation:pl 1s infinite}
@keyframes pl{0%,100%{opacity:1}50%{opacity:0.25}}
.up{display:flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;
  background:rgba(255,255,255,0.1);border-radius:20px;cursor:pointer;transition:background 0.14s}
.up:hover{background:rgba(255,255,255,0.17)}
.ua{width:22px;height:22px;border-radius:50%;background:var(--blue2);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:white;flex-shrink:0}
.un{font-size:10px;font-weight:700;color:rgba(255,255,255,0.88);max-width:75px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* NAVBAR */
.nav{background:white;border-bottom:2px solid var(--g200);display:flex;overflow-x:auto;
  scrollbar-width:none;position:sticky;top:52px;z-index:100;box-shadow:var(--sh)}
.nav::-webkit-scrollbar{display:none}
.nt{display:flex;align-items:center;gap:5px;padding:0 16px;height:40px;
  font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all 0.12s;flex-shrink:0}
.nt svg{width:13px;height:13px;flex-shrink:0}
.nt:hover{color:var(--navy);background:var(--g50)}
.nt.active{color:var(--navy);border-bottom-color:var(--navy)}

/* TOOLBAR */
.tbar{background:white;border-bottom:1.5px solid var(--g200);padding:7px 12px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--sh)}
.wn{display:flex;align-items:center;gap:4px}
.bn{width:26px;height:26px;border-radius:var(--r);border:1.5px solid var(--g200);
  background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--text3);transition:all 0.12s;flex-shrink:0}
.bn:hover{border-color:var(--navy);color:var(--navy);background:var(--sky)}
.wl{font-size:11px;font-weight:800;color:var(--navy);min-width:124px;text-align:center;letter-spacing:-0.2px}
.bt{padding:4px 10px;border-radius:var(--r);border:1.5px solid var(--navy3);
  background:var(--sky);color:var(--navy);font-size:10px;font-weight:800;
  cursor:pointer;transition:all 0.12s;font-family:inherit}
.bt:hover{background:var(--navy);color:white}
.leg{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){.leg{display:none}}
.lg{display:flex;align-items:center;gap:3px;font-size:9px;color:var(--text3);font-weight:600}
.lgd{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.lgt{padding:1px 4px;border-radius:3px;font-size:8px;font-weight:800}
.tr{margin-left:auto;display:flex;gap:6px}
.bad{display:flex;align-items:center;gap:4px;padding:5px 11px;border-radius:var(--r);
  background:var(--navy);color:white;border:none;font-size:11px;font-weight:800;
  cursor:pointer;font-family:inherit;transition:all 0.12s}
.bad:hover{background:var(--navy3)}
.bad span{display:none}
@media(min-width:460px){.bad span{display:inline}}
.brl{width:28px;height:28px;border-radius:var(--r);border:1.5px solid var(--g200);
  background:white;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.12s;color:var(--text3);flex-shrink:0}
.brl:hover{border-color:var(--navy);color:var(--navy);background:var(--sky)}
.brl svg{width:12px;height:12px}

/* PAGES */
.pg{display:none;flex:1}.pg.active{display:block}

/* PLANNER — MOBILE FIRST */
.pw{overflow-x:auto;padding:10px 10px 80px;-webkit-overflow-scrolling:touch}

/* Sticky first column on mobile */
.pgrid{display:grid;border-radius:var(--rm);overflow:hidden;
  border:2px solid var(--g200);box-shadow:var(--sh2)}

/* Mobile: show only current user column + date */
@media(max-width:700px){
  .pw{padding:8px 8px 80px}
  .pgrid{min-width:unset !important;border-radius:var(--r)}
  .gh-cell:not(.date-col):not(.mine-col){display:none}
  .person-cell:not(.mine):not(.off){display:none}
  /* Show all on mobile toggle */
  .pgrid.show-all .gh-cell{display:block}
  .pgrid.show-all .person-cell{display:flex}
  .pgrid.show-all{overflow-x:auto;min-width:700px !important}
}

.ghrow{display:grid;background:var(--navy)}
.gh-cell{padding:8px 5px;color:rgba(255,255,255,0.8);font-size:8.5px;font-weight:800;
  letter-spacing:0.8px;text-transform:uppercase;text-align:center;
  border-right:1px solid rgba(255,255,255,0.07)}
.gh-cell:last-child{border-right:none}
.gh-cell.date-col{text-align:left;padding-left:10px;color:rgba(255,255,255,0.5);
  font-size:8px;letter-spacing:0}
.gh-cell.mine-col{background:rgba(37,99,235,0.25);color:rgba(255,255,255,0.95);font-weight:900}

/* Day rows */
.dr{display:grid;background:white;border-top:2px solid var(--g200)}
.dr.we{background:#f4f7ff}
.dr.td{background:#e8f0ff;border-top:2.5px solid var(--blue2);border-bottom:2.5px solid var(--blue2)}
.dr.td+.dr{border-top:none}

/* Date cell */
.dc{padding:8px 9px;border-right:2.5px solid var(--g200);display:flex;
  flex-direction:column;justify-content:flex-start;min-height:60px;width:78px;min-width:78px}
.is-today .dc{border-left:3.5px solid var(--blue)}
.dn{font-size:20px;font-weight:900;line-height:1;color:var(--navy);
  font-family:'IBM Plex Mono',monospace}
.td .dn{color:var(--blue)}
.we .dn{color:var(--g400)}
.dl{font-size:8.5px;font-weight:700;color:var(--text3);margin-top:1px;letter-spacing:0.3px}
.tc{display:inline-block;margin-top:4px;padding:2px 6px;background:var(--blue);
  color:white;border-radius:10px;font-size:8.5px;font-weight:800;width:fit-content}

/* Person cells */
.pc{padding:4px 4px;border-right:1px solid var(--g200);min-height:60px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background 0.1s;position:relative}
.pc:last-child{border-right:none}
.pc:hover{background:var(--sky)}
.pc.mine{background:rgba(37,99,235,0.05)}
.pc.mine:hover{background:rgba(37,99,235,0.1)}
.pc.mine::after{content:'';position:absolute;top:0;right:0;
  width:2.5px;height:100%;background:var(--blue);opacity:0.4}
.pc.off{justify-content:center;align-items:center;cursor:default;background:var(--g50)}
.pc.off:hover{background:var(--g50)}
.ofl{font-size:8.5px;color:var(--g400);font-weight:600}

/* TASK CHIPS — more contrast */
.chip{display:flex;align-items:flex-start;gap:3px;border-radius:5px;
  padding:4px 5px;font-size:10px;line-height:1.35;
  border:1.5px solid var(--g200);cursor:pointer;transition:all 0.1s;
  background:var(--g100)}
.chip:hover{filter:brightness(0.95);border-color:var(--blue)}
.chip.s-todo      {background:var(--c-todo);border-color:var(--c-todo-b)}
.chip.s-inprogress{background:var(--c-prog);border-color:var(--c-prog-b)}
.chip.s-done      {background:var(--c-done);border-color:var(--c-done-b)}
.chip.s-blocked   {background:var(--c-blk); border-color:var(--c-blk-b)}
.chip.t-leave     {background:var(--c-leave);border-color:var(--c-leave-b)!important}
.chip.t-onsite    {background:var(--c-onsite);border-color:var(--c-onsite-b)!important}
.chip.t-meeting   {background:var(--c-meet);border-color:var(--c-meet-b)!important}
.chip.t-ma        {background:var(--c-ma);border-color:var(--c-ma-b)!important}
.cdot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:3.5px}
.s-todo .cdot{background:var(--c-todo-dot)}
.s-inprogress .cdot{background:var(--c-prog-dot)}
.s-done .cdot{background:var(--c-done-dot)}
.s-blocked .cdot{background:var(--c-blk-dot)}
.t-leave .cdot{background:var(--c-leave-dot)!important}
.t-onsite .cdot{background:var(--c-onsite-dot)!important}
.t-meeting .cdot{background:var(--c-meet-dot)!important}
.t-ma .cdot{background:var(--c-ma-dot)!important}
.cbody{flex:1;min-width:0}
.cname{color:var(--text);font-weight:700;word-break:break-word;font-size:10px}
.cfoot{display:flex;gap:3px;align-items:center;flex-wrap:wrap;margin-top:2px}
.ctag{padding:1px 4px;border-radius:3px;font-size:8px;font-weight:800;letter-spacing:0.2px;flex-shrink:0}
.tla{background:var(--c-leave-dot);color:white}
.ton{background:var(--c-onsite-dot);color:white}
.tme{background:var(--c-meet-dot);color:white}
.tma{background:var(--c-ma-dot);color:white}
.tsi{background:var(--navy3);color:white} /* site tag */
.cmd{font-size:9px;color:var(--text3);font-family:'IBM Plex Mono',monospace;font-weight:600}
.cno{font-size:8.5px;color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.addb{font-size:9.5px;color:var(--text3);padding:2px 4px;border-radius:3px;
  border:1px dashed var(--g300);text-align:center;transition:all 0.1s;cursor:pointer;margin-top:auto}
.addb:hover{border-color:var(--blue);color:var(--blue);background:var(--sky)}

/* Mobile view toggle button */
.mobile-toggle{display:none;margin:6px 10px 0;padding:6px 12px;border-radius:var(--r);
  border:1.5px solid var(--g200);background:white;font-size:11px;font-weight:700;
  color:var(--text2);cursor:pointer;font-family:inherit;width:calc(100% - 20px)}
@media(max-width:700px){.mobile-toggle{display:block}}

/* DASHBOARD */
.dw{padding:12px;display:flex;flex-direction:column;gap:12px;
  max-width:1100px;margin:0 auto;padding-bottom:80px}
.ds{font-size:9.5px;font-weight:800;color:var(--text3);letter-spacing:1.2px;
  text-transform:uppercase;margin-bottom:7px}
.sr{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}
.sc{background:white;border:1.5px solid var(--g200);border-radius:var(--rm);
  padding:12px;box-shadow:var(--sh)}
.sc.hl{background:var(--navy);border-color:var(--navy)}
.sn{font-size:26px;font-weight:900;color:var(--navy);font-family:'IBM Plex Mono',monospace;line-height:1}
.sc.hl .sn{color:white}
.sl{font-size:10px;color:var(--text3);font-weight:600;margin-top:2px}
.sc.hl .sl{color:rgba(255,255,255,0.5)}
.ss{font-size:9px;color:var(--text3)}
.sc.hl .ss{color:rgba(255,255,255,0.35)}
.mdc{background:white;border:1.5px solid var(--g200);border-radius:var(--rm);padding:12px;box-shadow:var(--sh)}
.mdb{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.mdr{display:grid;grid-template-columns:76px 1fr 36px;gap:6px;align-items:center}
.mdn{font-size:10px;font-weight:800;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdt{background:var(--g100);border-radius:3px;height:8px;overflow:hidden}
.mdf{height:100%;border-radius:3px;transition:width 0.5s ease}
.mdf.ok{background:#16a34a}.mdf.hv{background:#d97706}.mdf.ov{background:#dc2626}
.mdv{font-size:9.5px;font-weight:800;color:var(--text2);font-family:'IBM Plex Mono',monospace;text-align:right}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:9px}
.stcard{background:white;border:1.5px solid var(--g200);border-radius:var(--rm);
  padding:10px 12px;box-shadow:var(--sh)}
.stn{font-size:11px;font-weight:900;color:var(--navy);letter-spacing:-0.2px}
.stmd{font-size:19px;font-weight:900;color:var(--blue);font-family:'IBM Plex Mono',monospace;line-height:1.2}
.stct{font-size:9.5px;color:var(--text3);margin-top:1px}
.stpp{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.stpt{font-size:8.5px;padding:1px 4px;border-radius:3px;background:var(--sky);color:var(--navy3);font-weight:800}
.strow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.stm{background:var(--g50);border:1.5px solid var(--g200);border-radius:var(--rm);
  padding:10px 6px;text-align:center}
.stmn{font-size:20px;font-weight:900;font-family:'IBM Plex Mono',monospace;line-height:1}
.stml{font-size:9px;color:var(--text3);margin-top:2px;font-weight:700}
.stmp{font-size:8.5px;color:var(--text3)}

/* MODAL */
.mb{display:none;position:fixed;inset:0;background:rgba(10,25,60,0.55);
  z-index:300;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.mb.open{display:flex}
@media(min-width:560px){.mb{align-items:center}}
.mo{background:white;border-radius:var(--rl) var(--rl) 0 0;padding:18px 16px;
  width:100%;max-width:460px;box-shadow:0 -10px 50px rgba(0,0,0,0.2)}
@media(min-width:560px){.mo{border-radius:var(--rl);box-shadow:var(--sh3)}}
.mh{width:32px;height:4px;background:var(--g200);border-radius:2px;margin:0 auto 12px}
@media(min-width:560px){.mh{display:none}}
.mt{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:2px}
.ms{font-size:10px;color:var(--text3);margin-bottom:14px}
.fg{margin-bottom:10px}
.fl{font-size:9.5px;font-weight:800;color:var(--text2);letter-spacing:0.5px;
  text-transform:uppercase;margin-bottom:3px;display:block}
.fi,.fsel,.ft{width:100%;padding:8px 10px;border-radius:var(--r);border:1.5px solid var(--g200);
  font-size:13px;color:var(--text);background:white;font-family:inherit;
  transition:border-color 0.12s;outline:none}
.fi:focus,.fsel:focus,.ft:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.ft{resize:vertical;min-height:56px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* site badge in input */
.site-badge{display:none;margin-top:4px;padding:3px 8px;border-radius:4px;
  background:var(--navy);color:white;font-size:10px;font-weight:700;width:fit-content}
.site-badge.show{display:inline-block}
/* type buttons */
.trow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}
.tbtn{padding:6px 3px;border-radius:var(--r);border:1.5px solid var(--g200);
  background:white;font-size:9.5px;font-weight:800;cursor:pointer;font-family:inherit;
  text-align:center;transition:all 0.12s;color:var(--text3)}
.tbtn:hover{border-color:var(--navy);color:var(--navy)}
.tbtn.sn2{border-color:var(--navy);background:var(--navy);color:white}
.tbtn.sl2{border-color:var(--c-leave-dot);background:var(--c-leave);color:var(--c-leave-dot)}

<script>
// ══════════════════════════════════════
// CONFIG
// ══════════════════════════════════════
const URL = 'https://script.google.com/macros/s/AKfycbxQ1etAP5z5uOBQe7B95OiUvLBiTmlOVQU4YaZCsaWl7td3QOpDGtpyYhw_qRo5bWRW/exec';

const TEAM = [
  {id:'pu',  name:'PU',      emoji:'😎'},{id:'le',   name:'LE',      emoji:'😑'},
  {id:'dan', name:'DAN',     emoji:'🥸'},{id:'ae',   name:'A',       emoji:'🅰️'},
  {id:'boss',name:'BOSS',    emoji:'🅱️'},{id:'drop', name:'DROP',    emoji:'💧'},
  {id:'oo',  name:'AU',      emoji:'🪙'},{id:'bas',  name:'BAS',     emoji:'⛹️'},
  {id:'aim', name:'AUM',     emoji:'🩺'},{id:'wini', name:'WINIJNAN',emoji:'🕘'},
  {id:'bes', name:'BEST',    emoji:'📈'},
];

// ══ KNOWN SITES ══
const SITES = new Set([
  'DPI','UEC','ABA','FPI','PQS','SG','PML','TCRSS','UAPC','SNC','TG','TNK','TQM','VAVA','NTH',
  'BPG','PSG','TRR','HERTZ','SYNTEC','TSP','AOB','SSI','NPS','TAAP','SAMCO','EKA','TYG','TIS',
  'LCT','TST','PJF','TFMG','STGM','FCI','BTA','LTT','BEVPRO','SIWT','VRC','GYS','VP','GL',
  'BIGSTAR','COM7','PLM','NSDF','DEMO','HEXA','TCB','YRK','HAC','THR','THR1','THR2','THR3',
  'BIGCAMERA','ACS','TOZEN','RECOFTC','KTC','KTC1','KTC2','NKP','NKP1','NKP2','SW','ATT',
  'BSCM','HFVN','CM','TNI','TNI2','FG','KI','SOIHA','FPI_DEL','PML_DEL','TNK_DEL',
  'PSG_DEL','KTC1','NKP1','NKP2','THR3','RECOFTC','VP','BPC','TPM','RCF','RCOF','EGAT',
  'RMUTT','BEVPRO','AGR','TFMG','SHR','HAC','GEL','SUTEC','NPS','SHR','SK','UAPC','SYNT',
]);

function getSiteFromName(name) {
  const n = name.toUpperCase().trim();
  // Check full word match from known list
  const parts = n.split(/[\s_\-\.]+/);
  for (const p of parts) {
    if (SITES.has(p)) return p;
  }
  // MA pattern: MA SITENAME or SITENAME MA
  const maM = n.match(/^MA[\s_]([A-Z0-9]+)/) || n.match(/^([A-Z0-9]+)[\s_]MA\b/);
  if (maM) { const s = maM[1]; if (SITES.has(s)) return s; return s; }
  // First word fallback
  const fw = parts[0];
  if (fw && fw.length >= 2 && fw.length <= 12) return fw;
  return null;
}

// ══ TYPE DETECTION ══
const LKW = ['ลาป่วย','ลากิจ','ลาพักร้อน','วันลา','day off','leave','ลา'];
const OKW = ['onsite','on-site','on site','ออนไซต์'];
const MKW = ['meeting','meet','ประชุม','conference'];

function detectType(name) {
  const n = name.toLowerCase();
  if (LKW.some(k=>n.includes(k))) return 'leave';
  if (OKW.some(k=>n.includes(k))) return 'onsite';
  if (MKW.some(k=>n.includes(k))) return 'meeting';
  if (isMA(name)) return 'ma';
  return 'normal';
}
function isMA(name) {
  const n = name.toUpperCase();
  return /\bMA\b/.test(n)||n.startsWith('MA ')||n.startsWith('MA_');
}

// ══ STATE ══
let me=null, tasks=[], editing=null;
let mCtx={date:null,pid:null};
let wOff=0, curPage='planner', mobileAll=false;

// ══ LOGIN ══
function initLogin() {
  const g=document.getElementById('ng');
  TEAM.forEach(p=>{
    const b=document.createElement('button');
    b.className='nb'; b.dataset.id=p.id;
    b.innerHTML=`<span class="ne">${p.emoji}</span><span class="nn">${p.name}</span>`;
    b.onclick=()=>selName(p.id); g.appendChild(b);
  });
  const s=localStorage.getItem('fo_uid');
  if(s&&TEAM.find(p=>p.id===s)) selName(s);
}
function selName(id) {
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('sel',b.dataset.id===id));
  const b=document.getElementById('be'); b.disabled=false; b.dataset.sel=id;
}
function enterApp() {
  const id=document.getElementById('be').dataset.sel; if(!id) return;
  me=TEAM.find(x=>x.id===id);
  localStorage.setItem('fo_uid',id);
  document.getElementById('ls').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('ua').textContent=me.name[0];
  document.getElementById('un').textContent=me.emoji+' '+me.name;
  if(tasks.length===0) loadData(); else renderWeek();
}
function switchUser() {
  document.getElementById('ls').style.display='flex';
  document.getElementById('app').style.display='none';
}

// ══ MOBILE TOGGLE ══
function toggleMobileView() {
  mobileAll=!mobileAll;
  const g=document.getElementById('pgrid');
  const b=document.getElementById('mobile-toggle');
  g.classList.toggle('show-all',mobileAll);
  b.textContent=mobileAll?'👤 ดูเฉพาะของฉัน':'👁 ดูตารางทั้งทีม';
}

// ══ PAGE NAV ══
function switchPage(page,el) {
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nt').forEach(n=>n.classList.remove('active'));
  document.getElementById('pg-'+page).classList.add('active');
  el.classList.add('active'); curPage=page;
  if(page==='dashboard') renderDashboard();
}

// ══ DATA ══
function loadData(manual=false) {
  setSyn(true);
  return new Promise(res=>{
    const cb='gs_'+Date.now(), sc=document.createElement('script');
    const timer=setTimeout(()=>{
      delete window[cb]; sc.remove();
      toast('โหลดไม่สำเร็จ — ตรวจสอบ Apps Script'); setSyn(false); res();
    },12000);
    window[cb]=function(data){
      clearTimeout(timer); delete window[cb]; sc.remove();
      if(data&&data.values){
        tasks=parseRows(data.values); renderWeek();
        if(curPage==='dashboard') renderDashboard();
        if(manual) toast('โหลดข้อมูลสำเร็จ ✓');
      } else { toast('ไม่พบข้อมูล — ตรวจสอบชื่อ sheet "Planner"'); }
      setSyn(false); res();
    };
    sc.src=URL+'?callback='+cb+'&t='+Date.now();
    sc.onerror=()=>{clearTimeout(timer);delete window[cb];toast('โหลดไม่สำเร็จ');setSyn(false);res();};
    document.head.appendChild(sc);
  });
}

async function saveData() {
  setSyn(true);
  try {
    const vals=[
      ['id','date','personId','name','status','md','note','type'],
      ...tasks.map(t=>[t.id,t.date,t.personId,t.name,t.status,t.md||0,t.note||'',t.type||'normal'])
    ];
    await fetch(URL,{method:'POST',mode:'no-cors',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({values:vals})});
    toast('บันทึกแล้ว ✓');
    setTimeout(()=>loadData(),1600);
  } catch(e){ toast('บันทึกไม่สำเร็จ'); }
  setSyn(false);
}

function parseRows(vals) {
  if(!vals||vals.length<2) return [];
  return vals.slice(1).map((r,i)=>{
    let ds=String(r[1]||'');
    if(ds.includes('T')){const d=new Date(ds);ds=fmt(new Date(d.getTime()+7*3600*1000));}
    const name=String(r[3]||'');
    const st=String(r[7]||'');
    return {
      id:String(r[0]||i),date:ds,personId:String(r[2]||''),name,
      status:String(r[4]||'todo'),md:parseFloat(r[5])||0,note:String(r[6]||''),
      type:st&&st!=='normal'?st:detectType(name)
    };
  }).filter(t=>t.name&&t.date);
}

// ══ RENDER ══
function getWeek() {
  const t=new Date(), dow=t.getDay()===0?6:t.getDay()-1;
  const mon=new Date(t); mon.setDate(t.getDate()-dow+wOff*7); mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}
function fmt(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${dd}`;
}
const DS=['จ','อ','พ','พฤ','ศ','ส','อา'];
const MN=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function renderWeek() {
  const dates=getWeek(), tday=fmt(new Date());
  const m1=dates[0],m2=dates[6];
  document.getElementById('wl').textContent=
    `${m1.getDate()} ${MN[m1.getMonth()]} – ${m2.getDate()} ${MN[m2.getMonth()]} ${m1.getFullYear()+543}`;
  document.getElementById('tbm').textContent=`${MN[m1.getMonth()]} ${m1.getFullYear()+543}`;

  const tpl=`78px repeat(${TEAM.length},1fr)`;
  let h=`<div class="ghrow" style="grid-template-columns:${tpl}"><div class="gh-cell date-col">วัน</div>`;
  TEAM.forEach(p=>{
    const isMine=p.id===me?.id;
    h+=`<div class="gh-cell${isMine?' mine-col':''}">${p.name}</div>`;
  });
  h+=`</div>`;

  dates.forEach(date=>{
    const ds=fmt(date),dow=date.getDay(),isWE=dow===0||dow===6,di=dow===0?6:dow-1;
    const isT=ds===tday;
    h+=`<div class="dr${isT?' td':isWE?' we':''}" style="grid-template-columns:${tpl}">
      <div class="dc">
        <div class="dn">${date.getDate()}</div>
        <div class="dl">${DS[di]}</div>
        ${isT?'<div class="tc">วันนี้</div>':''}
      </div>`;

    TEAM.forEach(person=>{
      const isMine=person.id===me?.id;
      const dt=tasks.filter(t=>t.date===ds&&t.personId===person.id);
      if(isWE){
        h+=`<div class="pc off${isMine?' mine':''}"><span class="ofl">หยุด</span></div>`;
      } else {
        h+=`<div class="pc${isMine?' mine':''}" onclick="openAddModal('${ds}','${person.id}')">`;
        dt.forEach(t=>{
          const tp=t.type||detectType(t.name);
          const tc=tp!=='normal'?` t-${tp}`:'';
          const site=getSiteFromName(t.name);
          let tag='';
          if(tp==='leave')        tag=`<span class="ctag tla">ลา</span>`;
          else if(tp==='onsite')  tag=`<span class="ctag ton">Onsite</span>`;
          else if(tp==='meeting') tag=`<span class="ctag tme">Meet</span>`;
          else if(tp==='ma'||isMA(t.name)) tag=`<span class="ctag tma">MA</span>`;
          else if(site)           tag=`<span class="ctag tsi">${site}</span>`;
          h+=`<div class="chip s-${t.status}${tc}" onclick="event.stopPropagation();openEdit('${t.id}')">
            <div class="cdot"></div>
            <div class="cbody">
              <div class="cname">${esc(t.name)}</div>
              <div class="cfoot">${tag}${t.md?`<span class="cmd">${t.md}MD</span>`:''}${t.note?`<span class="cno">${esc(t.note.slice(0,14))}</span>`:''}</div>
            </div></div>`;
        });
        h+=`<div class="addb">+ เพิ่ม</div></div>`;
      }
    });
    h+=`</div>`;
  });

  const g=document.getElementById('pgrid');
  g.style.gridTemplateColumns=tpl;
  g.style.minWidth=`${78+TEAM.length*100}px`;
  g.innerHTML=h;
  if(mobileAll) g.classList.add('show-all');
}

// ══ DASHBOARD ══
function renderDashboard() {
  const dates=getWeek(),ws=fmt(dates[0]),we=fmt(dates[6]);
  const wt=tasks.filter(t=>t.date>=ws&&t.date<=we);
  const mdP={};TEAM.forEach(p=>{mdP[p.id]=0;});
  wt.forEach(t=>{if(mdP[t.personId]!==undefined)mdP[t.personId]+=t.md||0;});
  const totMD=Object.values(mdP).reduce((a,b)=>a+b,0);
  const maxMD=Math.max(...Object.values(mdP),1);
  const doneN=wt.filter(t=>t.status==='done').length;
  const blkN=wt.filter(t=>t.status==='blocked').length;
  const maT=wt.filter(t=>isMA(t.name)||t.type==='ma');
  const laT=wt.filter(t=>t.type==='leave'||LKW.some(k=>t.name.toLowerCase().includes(k)));
  const sm={};
  wt.forEach(t=>{
    const s=getSiteFromName(t.name)||'OTHER';
    if(!sm[s])sm[s]={md:0,ct:0,pp:new Set()};
    sm[s].md+=t.md||0;sm[s].ct++;sm[s].pp.add(t.personId);
  });
  const topS=Object.entries(sm).sort((a,b)=>b[1].md-a[1].md).slice(0,14);
  const sorted=TEAM.map(p=>({...p,md:mdP[p.id]||0})).sort((a,b)=>b.md-a.md);
  const sc={todo:0,inprogress:0,done:0,blocked:0};
  wt.forEach(t=>{if(sc[t.status]!==undefined)sc[t.status]++;});
  const st=wt.length||1;

  let h=`<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <div><div style="font-size:16px;font-weight:900;color:var(--navy)">สรุปสัปดาห์</div>
    <div style="font-size:10px;color:var(--text3);margin-top:1px">${dates[0].getDate()} ${MN[dates[0].getMonth()]} – ${dates[6].getDate()} ${MN[dates[6].getMonth()]} ${dates[0].getFullYear()+543}</div></div>
    <div style="display:flex;gap:5px">
      <button class="bn" onclick="prevWeek();renderDashboard()">‹</button>
      <button class="bt" onclick="goToday();renderDashboard()">สัปดาห์นี้</button>
      <button class="bn" onclick="nextWeek();renderDashboard()">›</button>
    </div></div>`;

  h+=`<div><div class="ds">ภาพรวม</div><div class="sr">
    <div class="sc hl"><div class="sn">${totMD.toFixed(1)}</div><div class="sl">Total MD</div><div class="ss">ทั้งทีม</div></div>
    <div class="sc"><div class="sn">${wt.length}</div><div class="sl">งานทั้งหมด</div><div class="ss">${doneN} เสร็จ</div></div>
    <div class="sc"><div class="sn" style="color:var(--c-ma-dot)">${maT.length}</div><div class="sl">งาน MA</div><div class="ss">${maT.reduce((a,t)=>a+(t.md||0),0).toFixed(1)} MD</div></div>
    <div class="sc"><div class="sn" style="color:var(--c-leave-dot)">${laT.length}</div><div class="sl">ลา</div><div class="ss">ราย</div></div>
    <div class="sc"><div class="sn" style="color:var(--c-blk-dot)">${blkN}</div><div class="sl">Blocked</div><div class="ss">ต้องติดตาม</div></div>
  </div></div>`;

  h+=`<div class="mdc"><div class="ds">ภาระงานรายคน (MD)</div><div class="mdb">`;
  sorted.forEach(p=>{
    const pct=maxMD>0?(p.md/maxMD*100):0;
    const cls=p.md>=5?'ov':p.md>=3?'hv':'ok';
    h+=`<div class="mdr"><div class="mdn">${p.emoji} ${p.name}</div>
      <div class="mdt"><div class="mdf ${cls}" style="width:${pct}%"></div></div>
      <div class="mdv">${p.md.toFixed(1)}</div></div>`;
  });
  h+=`</div></div>`;

  h+=`<div class="mdc"><div class="ds">สถานะงาน</div><div class="strow">
    ${[{k:'done',l:'Done',c:'var(--c-done-dot)'},{k:'inprogress',l:'In Progress',c:'var(--c-prog-dot)'},
       {k:'todo',l:'To Do',c:'var(--c-todo-dot)'},{k:'blocked',l:'Blocked',c:'var(--c-blk-dot)'}]
    .map(s=>`<div class="stm"><div class="stmn" style="color:${s.c}">${sc[s.k]}</div>
      <div class="stml">${s.l}</div><div class="stmp">${Math.round(sc[s.k]/st*100)}%</div></div>`).join('')}
  </div></div>`;

  if(topS.length>0){
    h+=`<div><div class="ds">งานแยกตาม Site</div><div class="stgrid">`;
    topS.forEach(([s,info])=>{
      const pp=[...info.pp].map(id=>TEAM.find(p=>p.id===id)?.name||id);
      h+=`<div class="stcard"><div class="stn">${esc(s)}</div>
        <div class="stmd">${info.md.toFixed(1)}<span style="font-size:10px;color:var(--text3)"> MD</span></div>
        <div class="stct">${info.ct} งาน</div>
        <div class="stpp">${pp.map(n=>`<span class="stpt">${esc(n)}</span>`).join('')}</div></div>`;
    });
    h+=`</div></div>`;
  }
  document.getElementById('dc').innerHTML=h;
}

// ══ MODAL ══
let _selType='normal';
function selType(type,el) {
  _selType=type;
  document.querySelectorAll('.tbtn').forEach(b=>{
    b.className='tbtn';
    if(b.dataset.type===type){
      const m={normal:'sn2',leave:'sl2',onsite:'so2',meeting:'sm2'};
      b.className='tbtn '+(m[type]||'sn2');
    }
  });
}

function openAddModal(ds,pid) {
  if(!ds){ds=fmt(new Date());pid=me?.id||TEAM[0].id;}
  editing=null; mCtx={date:ds,pid};
  _selType='normal';
  document.querySelectorAll('.tbtn').forEach(b=>{b.className='tbtn'+(b.dataset.type==='normal'?' sn2':'');});
  const p=TEAM.find(x=>x.id===pid), d=new Date(ds+'T00:00:00');
  document.getElementById('mt').textContent='เพิ่มงาน';
  document.getElementById('ms').textContent=`${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()+543} | ${p?.emoji||''} ${p?.name||pid}`;
  document.getElementById('fn').value='';
  document.getElementById('fst').value='todo';
  document.getElementById('fmd').value='';
  document.getElementById('fno').value='';
  document.getElementById('sw').style.display='none';
  document.getElementById('site-badge').className='site-badge';
  document.getElementById('bdl').style.display='none';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('fn').focus(),80);
}

function openEdit(id) {
  const t=tasks.find(x=>x.id===id); if(!t) return;
  editing=t; _selType=t.type||detectType(t.name);
  document.querySelectorAll('.tbtn').forEach(b=>{
    const m={normal:'sn2',leave:'sl2',onsite:'so2',meeting:'sm2'};
    b.className='tbtn'+(b.dataset.type===_selType?' '+(m[_selType]||'sn2'):'');
  });
  const p=TEAM.find(x=>x.id===t.personId), d=new Date(t.date+'T00:00:00');
  mCtx={date:t.date,pid:t.personId};
  document.getElementById('mt').textContent='แก้ไขงาน';
  document.getElementById('ms').textContent=`${d.getDate()} ${MN[d.getMonth()]} ${d.getFullYear()+543} | ${p?.emoji||''} ${p?.name||t.personId}`;
  document.getElementById('fn').value=t.name;
  document.getElementById('fst').value=t.status;
  document.getElementById('fmd').value=t.md||'';
  document.getElementById('fno').value=t.note||'';
  document.getElementById('sw').style.display='none';
  document.getElementById('bdl').style.display='block';
  onNameInput();
  document.getElementById('modal').classList.add('open');
}

function onNameInput() {
  const name=document.getElementById('fn').value.trim();
  const badge=document.getElementById('site-badge');
  const sw=document.getElementById('sw');
  // Site badge
  if(name.length>=2) {
    const site=getSiteFromName(name);
    if(site){ badge.textContent='📍 '+site; badge.className='site-badge show'; }
    else badge.className='site-badge';
  } else { badge.className='site-badge'; }
  // Conflict check
  if(!name||name.length<2){sw.style.display='none';return;}
  const mySite=(getSiteFromName(name)||name.toUpperCase().split(/[\s_]/)[0]);
  if(!mySite||mySite.length<2){sw.style.display='none';return;}
  const ds=mCtx.date, myPid=mCtx.pid;
  const same=tasks.filter(t=>{
    if(t.date!==ds||t.personId===myPid) return false;
    if(editing&&t.id===editing.id) return false;
    const ts=getSiteFromName(t.name)||t.name.toUpperCase().split(/[\s_]/)[0];
    return ts===mySite;
  });
  if(!same.length){sw.style.display='none';return;}
  const ns=[...new Set(same.map(t=>{const p=TEAM.find(x=>x.id===t.personId);return(p?.emoji||'')+' '+(p?.name||t.personId);}))];
  document.getElementById('swt').textContent=`มีคนทำ site "${mySite}" วันนี้แล้ว!`;
  document.getElementById('swb').innerHTML=ns.map(n=>`• ${n}`).join('<br>');
  sw.style.display='block';
}

function closeModal(){document.getElementById('modal').classList.remove('open');}

function saveTask() {
  const name=document.getElementById('fn').value.trim();
  if(!name){document.getElementById('fn').focus();return;}
  const data={date:mCtx.date,personId:mCtx.pid,name,
    status:document.getElementById('fst').value,
    md:parseFloat(document.getElementById('fmd').value)||0,
    note:document.getElementById('fno').value.trim(),
    type:_selType};
  if(editing){Object.assign(editing,data);}
  else{tasks.push({id:Date.now().toString(),...data});}
  closeModal(); renderWeek(); saveData();
}

function deleteTask() {
  if(!editing) return;
  if(!confirm('ลบงาน "'+editing.name+'" ?')) return;
  tasks=tasks.filter(t=>t.id!==editing.id);
  closeModal(); renderWeek(); saveData();
}

function prevWeek(){wOff--;renderWeek();}
function nextWeek(){wOff++;renderWeek();}
function goToday(){wOff=0;renderWeek();}

document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setSyn(on){
  document.getElementById('sd').classList.toggle('syn',on);
  document.getElementById('sl').textContent=on?'ซิงค์...':'พร้อม';
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

// ══ INIT ══
initLogin();
const lb=document.getElementById('lbar'); lb.classList.add('on');
loadData().finally(()=>{
  lb.classList.remove('on');
  const s=localStorage.getItem('fo_uid');
  if(s&&TEAM.find(p=>p.id===s)) selName(s);
});
</script>
