<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FO Planner — Bhatara Progress</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --navy:   #0f1f3d;
  --navy2:  #162847;
  --navy3:  #1e3a6e;
  --blue:   #2563eb;
  --blue2:  #3b82f6;
  --sky:    #e8f0fe;
  --white:  #ffffff;
  --gray50: #f8faff;
  --gray100:#f0f4ff;
  --gray200:#dde4f5;
  --gray400:#8898c4;
  --gray600:#5a6f9a;
  --text:   #0f1f3d;
  --text2:  #4a5d8a;
  --text3:  #8898c4;
  --orange: #f97316;
  --orange-light:#fff4ed;
  --green:  #16a34a;
  --green-light:#f0fdf4;
  --amber:  #d97706;
  --amber-light:#fffbeb;
  --red:    #dc2626;
  --red-light:#fef2f2;
  --shadow-sm: 0 1px 3px rgba(15,31,61,0.08);
  --shadow:    0 4px 16px rgba(15,31,61,0.10);
  --shadow-lg: 0 8px 32px rgba(15,31,61,0.14);
  --r:6px; --r-md:10px; --r-lg:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--gray50);color:var(--text);min-height:100vh;font-size:14px;line-height:1.5}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--navy) 0%,var(--navy3) 60%,#1a4494 100%);
  padding:20px;position:relative;overflow:hidden}
#login-screen::before{content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 70% 30%,rgba(37,99,235,0.15),transparent);pointer-events:none}
#login-screen::after{content:'FO';position:absolute;right:-20px;bottom:-40px;
  font-size:280px;font-weight:700;color:rgba(255,255,255,0.03);line-height:1;pointer-events:none;
  font-family:'IBM Plex Mono',monospace;letter-spacing:-10px}
.login-card{background:var(--white);border-radius:20px;padding:40px 36px;
  box-shadow:0 24px 80px rgba(0,0,0,0.3);width:100%;max-width:440px;position:relative;z-index:1}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.login-brand-mark{width:40px;height:40px;background:var(--navy);border-radius:10px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.login-brand-mark svg{width:22px;height:22px}
.login-brand-text{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase}
.login-brand-name{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
.login-title{font-size:22px;font-weight:700;color:var(--navy);margin-bottom:6px;letter-spacing:-0.5px}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.login-section-label{font-size:11px;font-weight:600;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.name-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.name-btn{padding:9px 6px;border-radius:var(--r);border:1.5px solid var(--gray200);
  background:var(--white);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s;
  color:var(--text2);font-family:inherit;text-align:center;line-height:1.3}
.name-btn:hover{border-color:var(--blue);background:var(--sky);color:var(--blue)}
.name-btn.selected{border-color:var(--navy);background:var(--navy);color:var(--white)}
.btn-enter{width:100%;padding:13px;border-radius:var(--r-md);
  background:var(--navy);color:var(--white);font-size:14px;font-weight:600;
  border:none;cursor:pointer;transition:all 0.15s;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px}
.btn-enter:hover:not(:disabled){background:var(--navy3);transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-enter:disabled{opacity:0.35;cursor:not-allowed}
.loading-bar{height:3px;background:var(--gray200);border-radius:2px;margin-top:16px;overflow:hidden;display:none}
.loading-bar.active{display:block}
.loading-bar-inner{height:100%;background:var(--blue);border-radius:2px;width:0%;animation:loadbar 1.5s ease-out forwards}
@keyframes loadbar{to{width:90%}}

/* ── SHELL ── */
#app{display:none;flex-direction:column;min-height:100vh}

/* ── TOPBAR ── */
.topbar{background:var(--navy);height:56px;padding:0 20px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:200;
  box-shadow:0 2px 12px rgba(0,0,0,0.2)}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-icon{width:30px;height:30px;background:rgba(255,255,255,0.1);border-radius:7px;
  display:flex;align-items:center;justify-content:center}
.topbar-icon svg{width:16px;height:16px;stroke:white}
.topbar-title{font-size:15px;font-weight:700;color:var(--white);letter-spacing:-0.3px}
.topbar-month{font-size:11px;color:rgba(255,255,255,0.5);font-weight:500;margin-left:4px}
.topbar-right{display:flex;align-items:center;gap:8px}
.sync-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;
  background:rgba(255,255,255,0.08);border-radius:20px;font-size:11px;color:rgba(255,255,255,0.6)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#22c55e}
.sync-dot.syncing{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.user-pill{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;
  background:rgba(255,255,255,0.1);border-radius:20px;cursor:pointer;transition:background 0.15s}
.user-pill:hover{background:rgba(255,255,255,0.18)}
.user-av{width:26px;height:26px;border-radius:50%;background:var(--blue2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:white}
.user-pill-name{font-size:12px;font-weight:600;color:rgba(255,255,255,0.9)}

/* ── NAVBAR ── */
.navbar{background:var(--white);border-bottom:1px solid var(--gray200);
  display:flex;overflow-x:auto;scrollbar-width:none;position:sticky;top:56px;z-index:100;
  box-shadow:var(--shadow-sm)}
.navbar::-webkit-scrollbar{display:none}
.nav-item{display:flex;align-items:center;gap:7px;padding:0 20px;height:44px;
  font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;transition:all 0.15s;flex-shrink:0;user-select:none}
.nav-item:hover{color:var(--navy);background:var(--gray50)}
.nav-item.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.nav-item svg{width:15px;height:15px;flex-shrink:0}

/* ── TOOLBAR ── */
.toolbar{background:var(--white);border-bottom:1px solid var(--gray200);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.week-nav{display:flex;align-items:center;gap:6px}
.btn-nav{width:30px;height:30px;border-radius:var(--r);border:1.5px solid var(--gray200);
  background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--text3);transition:all 0.15s;flex-shrink:0}
.btn-nav:hover{border-color:var(--navy);color:var(--navy);background:var(--sky)}
.week-label{font-size:13px;font-weight:600;color:var(--navy);min-width:140px;text-align:center}
.btn-today{padding:5px 12px;border-radius:var(--r);border:1.5px solid var(--navy3);
  background:var(--sky);color:var(--navy);font-size:12px;font-weight:600;
  cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-today:hover{background:var(--navy);color:var(--white)}
.legend{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text3)}
.leg-dot{width:7px;height:7px;border-radius:50%}
.toolbar-right{margin-left:auto;display:flex;gap:8px}
.btn-add{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);
  background:var(--navy);color:var(--white);border:none;font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.15s;font-family:inherit}
.btn-add:hover{background:var(--navy3)}
.btn-reload{width:32px;height:32px;border-radius:var(--r);border:1.5px solid var(--gray200);
  background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.15s;color:var(--text3)}
.btn-reload:hover{border-color:var(--navy);color:var(--navy)}
.btn-reload svg{width:14px;height:14px}

/* ── PAGES ── */
.page{display:none;flex:1}
.page.active{display:block}

/* ── PLANNER ── */
.planner-wrap{overflow-x:auto;padding:16px;padding-bottom:80px}
.planner-grid{display:grid;min-width:800px;border-radius:var(--r-md);overflow:hidden;
  border:1.5px solid var(--gray200);box-shadow:var(--shadow)}
.grid-header{display:grid;background:var(--navy)}
.gh-cell{padding:10px 8px;color:rgba(255,255,255,0.8);font-size:10px;font-weight:700;
  letter-spacing:0.8px;text-transform:uppercase;text-align:center;
  border-right:1px solid rgba(255,255,255,0.08)}
.gh-cell:last-child{border-right:none}
.gh-cell.date-col{text-align:left;padding-left:12px}
.day-row{display:grid;background:var(--white);border-top:1px solid var(--gray200)}
.day-row.weekend{background:#fafbff}
.day-row.is-today{background:#eff6ff}
.date-cell{padding:10px 12px;border-right:1px solid var(--gray200);
  display:flex;flex-direction:column;justify-content:center;min-height:54px;width:90px;min-width:90px}
.date-num{font-size:20px;font-weight:800;line-height:1;color:var(--navy);
  font-family:'IBM Plex Mono',monospace}
.is-today .date-num{color:var(--blue)}
.weekend .date-num{color:var(--text3)}
.date-day{font-size:9px;font-weight:600;color:var(--text3);margin-top:2px;letter-spacing:0.5px}
.today-pip{width:5px;height:5px;border-radius:50%;background:var(--blue);margin-top:4px}
.person-cell{padding:5px 6px;border-right:1px solid var(--gray200);min-height:54px;
  display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background 0.1s}
.person-cell:last-child{border-right:none}
.person-cell:hover{background:var(--sky)}
.person-cell.mine{background:#f0f7ff}
.person-cell.mine:hover{background:#dbeafe}
.task-chip{display:flex;align-items:flex-start;gap:3px;border-radius:5px;
  padding:4px 6px;font-size:10.5px;line-height:1.35;border:1px solid var(--gray200);
  cursor:pointer;transition:all 0.1s;background:var(--gray50)}
.task-chip:hover{border-color:var(--blue);background:var(--sky)}
.task-chip.s-done{background:var(--green-light);border-color:#86efac}
.task-chip.s-inprogress{background:var(--amber-light);border-color:#fcd34d}
.task-chip.s-blocked{background:var(--red-light);border-color:#fca5a5}
.chip-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:3.5px}
.s-done .chip-dot{background:var(--green)}
.s-inprogress .chip-dot{background:var(--amber)}
.s-blocked .chip-dot{background:var(--red)}
.s-todo .chip-dot{background:var(--gray400)}
.chip-body{flex:1;min-width:0}
.chip-name{color:var(--text);font-weight:500;word-break:break-word}
.chip-meta{font-size:9.5px;color:var(--text3);margin-top:1px;display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tag-ma{display:inline-block;padding:0px 4px;border-radius:3px;
  background:var(--orange);color:white;font-size:8.5px;font-weight:700;letter-spacing:0.3px}
.add-btn{font-size:10px;color:var(--text3);padding:3px 5px;border-radius:4px;
  border:1px dashed var(--gray200);text-align:center;transition:all 0.1s;cursor:pointer}
.add-btn:hover{border-color:var(--blue);color:var(--blue);background:var(--sky)}
.off-text{font-size:10px;color:var(--text3);margin:auto}

/* ── DASHBOARD ── */
.dash-wrap{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:1200px;margin:0 auto;padding-bottom:80px}
.dash-section-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:10px}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-card{background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r-md);
  padding:16px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow-sm)}
.stat-num{font-size:28px;font-weight:800;color:var(--navy);font-family:'IBM Plex Mono',monospace;line-height:1}
.stat-label{font-size:11px;color:var(--text3);font-weight:500}
.stat-sub{font-size:10px;color:var(--text3)}
.stat-card.highlight{background:var(--navy);border-color:var(--navy)}
.stat-card.highlight .stat-num,.stat-card.highlight .stat-label,.stat-card.highlight .stat-sub{color:white}
.stat-card.highlight .stat-label{color:rgba(255,255,255,0.6)}

/* MD bar chart */
.md-chart{background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r-md);padding:16px;box-shadow:var(--shadow-sm)}
.md-bars{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.md-bar-row{display:grid;grid-template-columns:90px 1fr 40px;gap:8px;align-items:center}
.md-bar-name{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md-bar-track{background:var(--gray100);border-radius:4px;height:10px;overflow:hidden}
.md-bar-fill{height:100%;border-radius:4px;background:var(--navy3);transition:width 0.6s ease}
.md-bar-fill.overload{background:var(--red)}
.md-bar-fill.heavy{background:var(--amber)}
.md-bar-fill.ok{background:var(--green)}
.md-bar-val{font-size:11px;font-weight:600;color:var(--text2);font-family:'IBM Plex Mono',monospace;text-align:right}

/* Site breakdown */
.site-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.site-card{background:var(--white);border:1.5px solid var(--gray200);border-radius:var(--r-md);
  padding:12px 14px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;gap:4px}
.site-name{font-size:13px;font-weight:700;color:var(--navy)}
.site-md{font-size:20px;font-weight:800;color:var(--blue);font-family:'IBM Plex Mono',monospace;line-height:1.2}
.site-count{font-size:11px;color:var(--text3)}
.site-people{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}
.site-person-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--sky);color:var(--navy3);font-weight:600}

/* ── MODAL ── */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,31,61,0.5);
  z-index:300;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal-backdrop.open{display:flex}
@media(min-width:600px){.modal-backdrop{align-items:center}}
.modal{background:var(--white);border-radius:var(--r-lg) var(--r-lg) 0 0;
  padding:24px 20px;width:100%;max-width:480px;box-shadow:0 -8px 40px rgba(0,0,0,0.2)}
@media(min-width:600px){.modal{border-radius:var(--r-lg);box-shadow:var(--shadow-lg)}}
.modal-handle{width:36px;height:4px;background:var(--gray200);border-radius:2px;
  margin:0 auto 16px;display:block}
@media(min-width:600px){.modal-handle{display:none}}
.modal-title{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:2px}
.modal-sub{font-size:12px;color:var(--text3);margin-bottom:18px}
.form-group{margin-bottom:12px}
.form-label{font-size:11px;font-weight:700;color:var(--text2);letter-spacing:0.5px;
  text-transform:uppercase;margin-bottom:5px;display:block}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 12px;border-radius:var(--r);
  border:1.5px solid var(--gray200);font-size:13px;color:var(--text);
  background:var(--white);font-family:inherit;transition:border-color 0.15s;outline:none}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(37,99,235,0.1)}
.form-textarea{resize:vertical;min-height:64px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.btn-cancel{padding:9px 18px;border-radius:var(--r);border:1.5px solid var(--gray200);
  background:var(--white);font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit}
.btn-cancel:hover{background:var(--gray100)}
.btn-save{padding:9px 20px;border-radius:var(--r);background:var(--navy);color:var(--white);
  border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-save:hover{background:var(--navy3)}
.btn-del{padding:9px 16px;border-radius:var(--r);background:var(--red-light);color:var(--red);
  border:1.5px solid #fca5a5;font-size:13px;cursor:pointer;margin-right:auto;font-family:inherit}
.btn-del:hover{background:var(--red);color:white}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);
  background:var(--navy);color:var(--white);padding:10px 18px;border-radius:8px;
  font-size:13px;z-index:999;opacity:0;transition:all 0.25s;pointer-events:none;
  box-shadow:var(--shadow-lg);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MOBILE adjustments ── */
@media(max-width:600px){
  .topbar{padding:0 12px}
  .topbar-title{font-size:14px}
  .sync-pill{display:none}
  .toolbar{padding:8px 12px;gap:8px}
  .week-label{min-width:120px;font-size:12px}
  .legend{display:none}
  .btn-add span{display:none}
  .planner-wrap{padding:10px;padding-bottom:80px}
  .dash-wrap{padding:12px;padding-bottom:80px}
  .stats-row{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){
  .name-grid{grid-template-columns:1fr 1fr}
  .login-card{padding:28px 20px}
}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="14" x2="11" y2="14"/><line x1="8" y1="17" x2="14" y2="17"/>
        </svg>
      </div>
      <div>
        <div class="login-brand-text">Bhatara Progress</div>
        <div class="login-brand-name">FO Work Planner</div>
      </div>
    </div>
    <div class="login-title">สวัสดี 👋</div>
    <div class="login-sub">เลือกชื่อของคุณเพื่อเริ่มใช้งาน</div>
    <div class="login-section-label">ทีม FO</div>
    <div class="name-grid" id="name-grid"></div>
    <button class="btn-enter" id="btn-enter" onclick="enterApp()" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v18h-6"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
      เข้าสู่ระบบ
    </button>
    <div class="loading-bar" id="loading-bar"><div class="loading-bar-inner" id="loading-bar-inner"></div></div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand">
      <div class="topbar-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/>
        </svg>
      </div>
      <span class="topbar-title">FO Planner</span>
      <span class="topbar-month" id="topbar-month"></span>
    </div>
    <div class="topbar-right">
      <div class="sync-pill"><div class="sync-dot" id="sync-dot"></div><span id="sync-label">พร้อม</span></div>
      <div class="user-pill" onclick="switchUser()">

<!-- MODAL -->
<div class="modal-backdrop" id="task-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modal-title">เพิ่มงานใหม่</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="form-group">
      <label class="form-label">ชื่องาน / Project *</label>
      <input class="form-input" id="f-name" placeholder="เช่น BEVPRO_Assignment..." />
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">สถานะ</label>
        <select class="form-select" id="f-status">
          <option value="todo">To Do</option>
          <option value="inprogress">In Progress</option>

      <button class="btn-save" onclick="saveTask()">บันทึก</button>
    </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════
// CONFIG
// ═══════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxrSnvPqorTnSqcVOvfYvJA7PPhHZ27mLF5_d3bZQf6q3IkHeLG1R6r8QFezmYFnmW1/exec';

const TEAM = [
  {id:'pu',   name:'Pu',        emoji:'😎', full:'Pu 😎'},
  {id:'le',   name:'Le',        emoji:'😑', full:'Le 😑'},
  {id:'dan',  name:'Dan',       emoji:'🥸', full:'Dan 🥸'},
  {id:'ae',   name:'A',         emoji:'🅰️', full:'A 🅰️'},
  {id:'boss', name:'BOSS',      emoji:'🅱️', full:'BOSS 🅱️'},
  {id:'drop', name:'Drop',      emoji:'💧', full:'Drop 💧'},
  {id:'oo',   name:'AU',        emoji:'🪙', full:'AU 🪙'},
  {id:'bas',  name:'BAS',       emoji:'⛹️', full:'BAS ⛹️'},
  {id:'aim',  name:'AUM',       emoji:'🩺', full:'AUM 🩺'},
  {id:'wini', name:'WINIJNAN',  emoji:'🕘', full:'WINIJNAN 🕘'},
  {id:'bes',  name:'BEST',      emoji:'📈', full:'BEST 📈'},
];

// ═══════════════════════════════════
// STATE
// ═══════════════════════════════════
let currentUser = null;
let tasks = [], editingTask = null;
let modalCtx = {date:null, personId:null};
let weekOffset = 0;
let currentPage = 'planner';

// ═══════════════════════════════════
// LOGIN
// ═══════════════════════════════════
function initLogin() {
  const grid = document.getElementById('name-grid');
  TEAM.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'name-btn';
    btn.innerHTML = `<div>${p.emoji}</div><div>${p.name}</div>`;
    btn.dataset.id = p.id;
    btn.onclick = () => selectName(p.id);
    grid.appendChild(btn);
  });
  const saved = localStorage.getItem('planner_uid');
  if (saved && TEAM.find(p=>p.id===saved)) selectName(saved);
}

function selectName(id) {
  document.querySelectorAll('.name-btn').forEach(b=>b.classList.toggle('selected', b.dataset.id===id));
  const btn = document.getElementById('btn-enter');
  btn.disabled = false;
  btn.dataset.sel = id;
}

function enterApp() {
  const id = document.getElementById('btn-enter').dataset.sel;
  if (!id) return;
  const p = TEAM.find(x=>x.id===id);
  currentUser = p;
  localStorage.setItem('planner_uid', id);
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('user-av').textContent = p.name[0];
  document.getElementById('user-pill-name').textContent = p.name;
  if (tasks.length === 0) loadData();
  else renderWeek();
}

function switchUser() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

// ═══════════════════════════════════
// PAGE NAV
// ═══════════════════════════════════
function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+page).classList.add('active');
  el.classList.add('active');
  currentPage = page;
  if (page === 'dashboard') renderDashboard();
}

// ═══════════════════════════════════
// DATA
// ═══════════════════════════════════
async function loadData(manual=false) {
  setSyncing(true);
  if (manual) showToast('กำลังโหลดข้อมูล...');
  try {
    const res = await fetch(APPS_SCRIPT_URL + '?t=' + Date.now());
    const data = await res.json();
    if (data.values) {
      tasks = parseRows(data.values);
      renderWeek();
      if (currentPage === 'dashboard') renderDashboard();
      if (manual) showToast('โหลดข้อมูลสำเร็จ ✓');
    }
  } catch(e) {
    console.error(e);
    showToast('โหลดไม่สำเร็จ: ' + e.message);
  }
  setSyncing(false);
}

async function saveData() {
  setSyncing(true);
  try {
    const values = [
      ['id','date','personId','name','status','md','note'],
      ...tasks.map(t=>[t.id, t.date, t.personId, t.name, t.status, t.md||0, t.note||''])
    ];
    await fetch(APPS_SCRIPT_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({values})
    });
    showToast('บันทึกแล้ว ✓');
    setTimeout(()=>loadData(), 1500);
  } catch(e) {
    showToast('บันทึกไม่สำเร็จ');
  }
  setSyncing(false);
}

function parseRows(values) {
  if (!values || values.length < 2) return [];
  return values.slice(1).map((r,i) => {
    let dateStr = String(r[1]||'');
    if (dateStr.includes('T')) {
      const d = new Date(dateStr);
      dateStr = fmtDate(new Date(d.getTime() + 7*3600*1000));
    }
    return {
      id: String(r[0]||i), date: dateStr, personId: String(r[2]||''),
      name: String(r[3]||''), status: String(r[4]||'todo'),
      md: parseFloat(r[5])||0, note: String(r[6]||'')
    };
  }).filter(t=>t.name&&t.date);
}

// ═══════════════════════════════════
// SITE EXTRACTION
// ═══════════════════════════════════
function extractSite(name) {
  const n = name.toUpperCase().trim();
  // MA pattern: "MA SITE_..." or "MA_SITE" or "SITE MA Issue"
  const maPatterns = [
    /^MA\s+([A-Z0-9\-]+)/,
    /^MA_([A-Z0-9\-]+)/,
    /([A-Z0-9\-]+)\s+MA\s+(ISSUE|CR|ASSIGN)/,
    /^([A-Z0-9\-]+)\s+MA\s/,
  ];
  for (const re of maPatterns) {
    const m = n.match(re);
    if (m) return { site: m[1].replace(/[_-]/g,' '), isMA: true };
  }
  // Normal: first word before _ or space
  const firstWord = n.split(/[_\s]/)[0];
  if (firstWord && firstWord.length >= 2) return { site: firstWord, isMA: false };
  return { site: 'OTHER', isMA: false };
}

function isMA(name) {
  const n = name.toUpperCase();
  return n.includes(' MA ') || n.startsWith('MA ') || n.startsWith('MA_') ||
    /\(MA\)/.test(n) || / MA$/.test(n);
}

// ═══════════════════════════════════
// RENDER WEEK
// ═══════════════════════════════════
function getWeekDates() {
  const today = new Date();
  const dow = today.getDay()===0?6:today.getDay()-1;
  const mon = new Date(today);
  mon.setDate(today.getDate()-dow+weekOffset*7);
  mon.setHours(0,0,0,0);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
}

function fmtDate(d) {
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

const DAYS   = ['จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์','อาทิตย์'];
const DAYS_S = ['จ','อ','พ','พฤ','ศ','ส','อา'];
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function renderWeek() {
  const dates = getWeekDates(), todayStr = fmtDate(new Date());
  const m1=dates[0], m2=dates[6];
  document.getElementById('week-label').textContent =
    `${m1.getDate()} ${MONTHS[m1.getMonth()]} – ${m2.getDate()} ${MONTHS[m2.getMonth()]} ${m1.getFullYear()+543}`;
  document.getElementById('topbar-month').textContent =
    `${MONTHS[m1.getMonth()]} ${m1.getFullYear()+543}`;

  const colTpl = `90px repeat(${TEAM.length},1fr)`;
  let h = `<div class="grid-header" style="grid-template-columns:${colTpl}"><div class="gh-cell date-col">วัน</div>`;
  TEAM.forEach(p=>{ h+=`<div class="gh-cell">${p.name}</div>`; });
  h += `</div>`;

  dates.forEach(date => {
    const ds = fmtDate(date);
    const dow = date.getDay(), isWE = dow===0||dow===6, di = dow===0?6:dow-1;
    const isToday = ds === todayStr;
    h += `<div class="day-row${isToday?' is-today':isWE?' weekend':''}" style="grid-template-columns:${colTpl}">
      <div class="date-cell">
        <div class="date-num">${date.getDate()}</div>
        <div class="date-day">${DAYS_S[di]}</div>
        ${isToday?'<div class="today-pip"></div>':''}
      </div>`;

    TEAM.forEach(person => {
      const mine = person.id === currentUser?.id;
      const dt = tasks.filter(t=>t.date===ds&&t.personId===person.id);
      if (isWE) {
        h += `<div class="person-cell" style="justify-content:center"><span class="off-text">หยุด</span></div>`;
      } else {
        h += `<div class="person-cell${mine?' mine':''}" onclick="openAddModal('${ds}','${person.id}')">`;
        dt.forEach(t => {
          const maTag = isMA(t.name) ? `<span class="tag-ma">MA</span>` : '';
          const {site} = extractSite(t.name);
          h += `<div class="task-chip s-${t.status}" onclick="event.stopPropagation();openEditModal('${t.id}')">
            <div class="chip-dot"></div>
            <div class="chip-body">
              <div class="chip-name">${escHtml(t.name)}</div>
              <div class="chip-meta">${maTag}${t.md?`<span>${t.md}MD</span>`:''}${t.note?`<span>· ${escHtml(t.note.slice(0,15))}</span>`:''}</div>
            </div></div>`;
        });
        h += `<div class="add-btn">+ เพิ่ม</div></div>`;
      }
    });
    h += `</div>`;
  });

  document.getElementById('planner-grid').innerHTML = h;
}

// ═══════════════════════════════════
// DASHBOARD
// ═══════════════════════════════════
function renderDashboard() {
  const dates = getWeekDates();
  const weekStart = fmtDate(dates[0]), weekEnd = fmtDate(dates[6]);
  const weekTasks = tasks.filter(t => t.date >= weekStart && t.date <= weekEnd);

  // MD per person
  const mdByPerson = {};
  TEAM.forEach(p => { mdByPerson[p.id] = 0; });
  weekTasks.forEach(t => { if(mdByPerson[t.personId]!==undefined) mdByPerson[t.personId] += t.md||0; });

  const totalMD = Object.values(mdByPerson).reduce((a,b)=>a+b, 0);
  const taskCount = weekTasks.length;
  const maxMD = Math.max(...Object.values(mdByPerson), 1);
  const doneCount = weekTasks.filter(t=>t.status==='done').length;
  const blockedCount = weekTasks.filter(t=>t.status==='blocked').length;

  // Sites
  const siteMap = {};
  weekTasks.forEach(t => {
    const {site} = extractSite(t.name);
    if (!siteMap[site]) siteMap[site] = {md:0, count:0, people:new Set()};
    siteMap[site].md += t.md||0;
    siteMap[site].count++;
    siteMap[site].people.add(t.personId);
  });
  const topSites = Object.entries(siteMap).sort((a,b)=>b[1].md-a[1].md).slice(0,12);

  // MA tasks
  const maTasks = weekTasks.filter(t=>isMA(t.name));
  const maCount = maTasks.length;
  const maMD = maTasks.reduce((a,t)=>a+(t.md||0),0);

  // Sort by MD desc for bar chart
  const sorted = TEAM.map(p=>({...p, md:mdByPerson[p.id]||0})).sort((a,b)=>b.md-a.md);

  let h = ``;

  // Week header
  h += `<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
    <div>
      <div style="font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-0.5px">สรุปสัปดาห์</div>
      <div style="font-size:12px;color:var(--text3);margin-top:2px">${dates[0].getDate()} ${MONTHS[dates[0].getMonth()]} – ${dates[6].getDate()} ${MONTHS[dates[6].getMonth()]} ${dates[0].getFullYear()+543}</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn-nav" onclick="prevWeek();renderDashboard()">‹</button>
      <button class="btn-today" onclick="goToday();renderDashboard()">สัปดาห์นี้</button>
      <button class="btn-nav" onclick="nextWeek();renderDashboard()">›</button>
    </div>
  </div>`;

  // Stats row
  h += `<div>
    <div class="dash-section-title">ภาพรวม</div>
    <div class="stats-row">
      <div class="stat-card highlight">
        <div class="stat-num">${totalMD.toFixed(1)}</div>
        <div class="stat-label">Total MD</div>
        <div class="stat-sub">สัปดาห์นี้ทั้งทีม</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${taskCount}</div>
        <div class="stat-label">งานทั้งหมด</div>
        <div class="stat-sub">${doneCount} เสร็จแล้ว</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:var(--orange)">${maCount}</div>
        <div class="stat-label">งาน MA</div>
        <div class="stat-sub">${maMD.toFixed(1)} MD</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" style="color:var(--red)">${blockedCount}</div>
        <div class="stat-label">Blocked</div>
        <div class="stat-sub">ต้องติดตาม</div>
      </div>
    </div>
  </div>`;

  // MD per person bar chart
  h += `<div class="md-chart">
    <div class="dash-section-title">ภาระงานรายคน (MD)</div>
    <div class="md-bars">`;
  sorted.forEach(p => {
    const pct = maxMD > 0 ? (p.md/maxMD*100) : 0;
    const cls = p.md >= 5 ? 'overload' : p.md >= 3 ? 'heavy' : 'ok';
    h += `<div class="md-bar-row">
      <div class="md-bar-name" title="${p.full}">${p.name}</div>
      <div class="md-bar-track"><div class="md-bar-fill ${cls}" style="width:${pct}%"></div></div>
      <div class="md-bar-val">${p.md.toFixed(1)}</div>
    </div>`;
  });
  h += `</div></div>`;

  // Status breakdown
  const statusCount = {todo:0, inprogress:0, done:0, blocked:0};
  weekTasks.forEach(t=>{if(statusCount[t.status]!==undefined)statusCount[t.status]++;});
  const statusTotal = weekTasks.length || 1;
  h += `<div class="md-chart">
    <div class="dash-section-title">สถานะงาน</div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px">
      ${[
        {k:'done',    label:'Done',        color:'var(--green)'},
        {k:'inprogress',label:'In Progress',color:'var(--amber)'},
        {k:'todo',    label:'To Do',        color:'var(--gray400)'},
        {k:'blocked', label:'Blocked',      color:'var(--red)'},
      ].map(s=>`<div style="text-align:center;padding:12px 6px;background:var(--gray50);border-radius:var(--r-md);border:1.5px solid var(--gray200)">
        <div style="font-size:22px;font-weight:800;color:${s.color};font-family:'IBM Plex Mono',monospace">${statusCount[s.k]}</div>
        <div style="font-size:10px;color:var(--text3);margin-top:2px;font-weight:600">${s.label}</div>
        <div style="font-size:10px;color:var(--text3)">${Math.round(statusCount[s.k]/statusTotal*100)}%</div>
      </div>`).join('')}
    </div>
  </div>`;

  // Site breakdown
  if (topSites.length > 0) {
    h += `<div>
      <div class="dash-section-title">งานแยกตาม Site</div>
      <div class="site-grid">`;
    topSites.forEach(([site, info]) => {
      const people = [...info.people].map(id=>TEAM.find(p=>p.id===id)?.name||id);
      h += `<div class="site-card">
        <div class="site-name">${escHtml(site)}</div>
        <div class="site-md">${info.md.toFixed(1)} <span style="font-size:12px;color:var(--text3)">MD</span></div>
        <div class="site-count">${info.count} งาน</div>
        <div class="site-people">${people.map(n=>`<span class="site-person-tag">${escHtml(n)}</span>`).join('')}</div>
      </div>`;
    });
    h += `</div></div>`;
  }

  document.getElementById('dash-content').innerHTML = h;
}

// ═══════════════════════════════════
// MODAL
// ═══════════════════════════════════
function openAddModal(ds, pid) {
  if (!ds) { ds=fmtDate(new Date()); pid=currentUser?.id||TEAM[0].id; }
  editingTask=null; modalCtx={date:ds, personId:pid};
  const p=TEAM.find(x=>x.id===pid), d=new Date(ds+'T00:00:00');
  document.getElementById('modal-title').textContent = 'เพิ่มงานใหม่';
  document.getElementById('modal-sub').textContent = `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543} | ${p?.full||pid}`;
  document.getElementById('f-name').value='';
  document.getElementById('f-status').value='todo';
  document.getElementById('f-md').value='';
  document.getElementById('f-note').value='';
  document.getElementById('btn-del').style.display='none';
  document.getElementById('task-modal').classList.add('open');
  setTimeout(()=>document.getElementById('f-name').focus(),100);
}

function openEditModal(id) {
  const t=tasks.find(x=>x.id===id); if(!t) return;
  editingTask=t;
  const p=TEAM.find(x=>x.id===t.personId), d=new Date(t.date+'T00:00:00');
  document.getElementById('modal-title').textContent='แก้ไขงาน';
  document.getElementById('modal-sub').textContent=`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()+543} | ${p?.full||t.personId}`;
  document.getElementById('f-name').value=t.name;
  document.getElementById('f-status').value=t.status;
  document.getElementById('f-md').value=t.md||'';
  document.getElementById('f-note').value=t.note||'';
  document.getElementById('btn-del').style.display='block';
  document.getElementById('task-modal').classList.add('open');
}

function closeModal(){document.getElementById('task-modal').classList.remove('open');}

function saveTask() {
  const name=document.getElementById('f-name').value.trim();
  if(!name){document.getElementById('f-name').focus();return;}
  const data={date:modalCtx.date, personId:modalCtx.personId, name,
    status:document.getElementById('f-status').value,
    md:parseFloat(document.getElementById('f-md').value)||0,
    note:document.getElementById('f-note').value.trim()};
  if(editingTask){Object.assign(editingTask,data);}
  else{tasks.push({id:Date.now().toString(),...data});}
  closeModal(); renderWeek(); saveData();
}

function deleteTask() {
  if(!editingTask) return;
  if(!confirm('ลบงาน "'+editingTask.name+'" ?')) return;
  tasks=tasks.filter(t=>t.id!==editingTask.id);
  closeModal(); renderWeek(); saveData();
}

function prevWeek(){weekOffset--;renderWeek();}
function nextWeek(){weekOffset++;renderWeek();}
function goToday(){weekOffset=0;renderWeek();}

document.getElementById('task-modal').addEventListener('click',function(e){if(e.target===this)closeModal();});

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function setSyncing(on){
  document.getElementById('sync-dot').classList.toggle('syncing',on);
  document.getElementById('sync-label').textContent=on?'ซิงค์...':'พร้อม';
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

initLogin();

const bar = document.getElementById('loading-bar');
bar.classList.add('active');
loadData().finally(() => {
  bar.classList.remove('active');
  const saved = localStorage.getItem('planner_uid');
  if (saved && TEAM.find(p=>p.id===saved)) selectName(saved);
});
